# ============================================
# Rural Tourism Frontend - CD Deploy Staging
# ============================================
# Deploy to staging server via SSH
# Triggered after CD Build succeeds on develop branch

name: CD Deploy Staging

on:
  workflow_run:
    workflows: ["CD Build"]
    types: [completed]
    branches: [develop]

permissions:
  packages: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: staging
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Set deployment start time
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Notify Slack - Staging Deployment Starting
        run: |
          set -e

          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          ACTOR='${{ github.actor }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          COMMIT_MSG=$(echo ${{ toJson(github.event.workflow_run.head_commit.message || 'Manual dispatch') }} | sed 's/\\n/\n/g')

          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg msg "$COMMIT_MSG" \
            --arg runurl "$RUN_URL" \
            '{
              text: ":building_construction: Frontend staging deployment started",
              blocks: [
                { type: "header", text: { type: "plain_text", text: "🏗️ [Staging] Frontend Deployment Started" } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*Repository:*\n" + $repo) },
                    { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                    { type: "mrkdwn", text: ("*Commit:*\n" + $sha) },
                    { type: "mrkdwn", text: ("*Actor:*\n" + $actor) }
                  ]
                },
                { type: "section", text: { type: "mrkdwn", text: ("*Message:*\n" + $msg) } },
                { type: "context", elements: [
                    { type: "mrkdwn", text: ("<" + $runurl + "|View workflow run>") }
                  ]
                }
              ]
            }')
          echo "$payload" | curl -s -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL" || echo "Warning: Failed to send Slack notification"
          echo "Sent Slack start notification"

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd ~/st_rural_tourism_staging

            # Login to GHCR
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Capture the currently-running image so a manual rollback stays
            # deterministic if this deploy fails the readiness gate below.
            # (Automatic rollback is not yet implemented — see
            # docs/UPLOADS_404_POSTMORTEM_2026-08-19.md follow-ups. This is
            # the minimum requirement: never lose track of "what was running
            # before".)
            PREVIOUS_IMAGE=$(docker inspect --format '{{.Image}}' rt_frontend_staging 2>/dev/null || echo "")
            echo "Previous frontend image: ${PREVIOUS_IMAGE:-none (first deploy)}"

            # Pull develop-tagged frontend image
            docker compose pull frontend_staging

            # Restart frontend staging
            docker compose up -d frontend_staging

            # --- Layered readiness gate ---
            # Deliberately state-based, not time-based: a deploy is only
            # "successful" once every layer below passes. Each layer catches
            # a different failure domain; see the deployment hardening plan
            # for the full rationale. No `docker image prune` here — cleanup
            # is a separate, later policy so a bad deploy never destroys the
            # image needed to roll back to.

            # Layer 1-2: container running + Docker HEALTHCHECK healthy.
            # Frontend HEALTHCHECK is --interval=30s --timeout=5s
            # --start-period=5s --retries=3; 90s gives comfortable margin
            # over a single check cycle. Tune from observed deploy timing,
            # not as a fixed assumption.
            echo "Waiting for rt_frontend_staging to become healthy..."
            TIMEOUT_SECONDS=90
            ELAPSED=0
            HEALTHY=0
            while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ]; do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' rt_frontend_staging 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "rt_frontend_staging is healthy"
                HEALTHY=1
                break
              fi
              sleep 3
              ELAPSED=$((ELAPSED + 3))
            done
            docker compose ps
            if [ "$HEALTHY" != "1" ]; then
              echo "ERROR: rt_frontend_staging did not become healthy within ${TIMEOUT_SECONDS}s (last status: $STATUS)"
              docker compose logs --tail=50 frontend_staging
              exit 1
            fi

            # Layer 3: local health check (host port, bypasses Cloudflare/DNS).
            # Port matches FRONTEND_EXTERNAL_PORT's default in
            # docker-compose.yml (8082) — not read from .env here since this
            # shell doesn't source it; update if that default ever changes.
            if ! curl -sf "http://localhost:8082/api/health" > /dev/null; then
              echo "ERROR: local /api/health check failed (nginx/backend chain broken on host)"
              exit 1
            fi
            echo "Local health check passed"

            # Layer 4: public health check (exercises Cloudflare/DNS/TLS too)
            if ! curl -sf https://staging.rutec.my/api/health > /dev/null; then
              echo "ERROR: public /api/health check failed through the public domain"
              exit 1
            fi
            echo "Public health check passed"

            # Layers 5-6: permanent deployment canary under /uploads/,
            # checked for both HTTP 200 and exact expected content. This is
            # the layer that actually exercises the nginx location-routing
            # path that silently broke on 2026-08-19 (see
            # docs/UPLOADS_404_POSTMORTEM_2026-08-19.md) — none of the health
            # endpoints above touch that path. A real uploaded document is
            # deliberately NOT used here: it can be deleted/replaced
            # independently of deploy health, which would make this check
            # flaky. Provisioning is idempotent (safe to (re)run every
            # deploy) and backend-local, since nginx has no volume mount of
            # its own and only ever reaches /uploads/ by proxying to the
            # backend container that writes it (confirmed: `docker inspect
            # rt_frontend_staging --format '{{json .Mounts}}'` → `[]`).
            docker exec rt_backend_staging sh -c \
              'mkdir -p /app/uploads/_healthcheck && printf "%s" "RUTEC_UPLOAD_CANARY_V1" > /app/uploads/_healthcheck/deploy-canary.txt'

            CANARY_URL="https://staging.rutec.my/uploads/_healthcheck/deploy-canary.txt"
            EXPECTED_BODY="RUTEC_UPLOAD_CANARY_V1"
            RESPONSE=$(curl -s -w '\n%{http_code}' "$CANARY_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" != "200" ] || [ "$BODY" != "$EXPECTED_BODY" ]; then
              echo "ERROR: uploads canary check failed (HTTP $HTTP_CODE, body: '$BODY')"
              exit 1
            fi
            echo "Uploads canary check passed"

      - name: Notify Slack - Staging Deployment Result
        if: always()
        run: |
          set -e
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          FULL_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          ACTOR='${{ github.actor }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          STATUS='${{ job.status }}'
          END_TIME=$(date +%s)
          DURATION=$(( END_TIME - START_TIME ))
          HUMAN_DURATION=$(printf '%02dm:%02ds' $((DURATION/60)) $((DURATION%60)))
          COMMIT_MSG=$(echo ${{ toJson(github.event.workflow_run.head_commit.message || 'Manual dispatch') }} | sed 's/\\n/\n/g')

          if [ "$STATUS" = "success" ]; then
            TITLE="✅ [Staging] Frontend Deployment Succeeded"
            RESULT_LINE="*Result:* Success"
            COLOR="#2eb886"
          else
            TITLE="❌ [Staging] Frontend Deployment Failed"
            RESULT_LINE="*Result:* Failure"
            COLOR="#e01e5a"
          fi

          payload=$(jq -n \
            --arg color "$COLOR" \
            --arg title "$TITLE" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$ACTOR" \
            --arg msg "$COMMIT_MSG" \
            --arg runurl "$RUN_URL" \
            --arg result "$RESULT_LINE" \
            --arg dur "$HUMAN_DURATION" \
            '{
              text: $title,
              blocks: [
                { type: "header", text: { type: "plain_text", text: $title } },
                { type: "section", fields: [
                    { type: "mrkdwn", text: ("*Repository:*\n" + $repo) },
                    { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                    { type: "mrkdwn", text: ("*Commit:*\n" + $sha) },
                    { type: "mrkdwn", text: ("*Actor:*\n" + $actor) },
                    { type: "mrkdwn", text: $result },
                    { type: "mrkdwn", text: ("*Duration:*\n" + $dur) }
                  ]
                },
                { type: "section", text: { type: "mrkdwn", text: ("*Message:*\n" + $msg) } },
                { type: "context", elements: [
                    { type: "mrkdwn", text: ("<" + $runurl + "|View workflow run>") }
                  ]
                }
              ]
            }')
          echo "$payload" | curl -s -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL" || echo "Warning: Failed to send Slack notification"
          echo "Sent Slack result notification ($STATUS)"
