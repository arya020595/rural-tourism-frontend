<section class="form-section">
  <h3>New Package Booking</h3>

  <div class="field-grid one-col">
    <div class="field">
      <label>2. Tarikh/Date<span class="required">*</span></label>
      <input type="text" [value]="booking?.bookedDate" readonly />
    </div>
  </div>

  <div class="field-grid three-col">
    <label
      class="radio-card"
      [class.checked]="booking?.customerType === 'tourist'"
    >
      <input
        type="radio"
        name="customerType"
        value="tourist"
        [checked]="booking?.customerType === 'tourist'"
        [disabled]="
          booking?.status === 'Paid' ||
          booking?.status === 'Pending' ||
          booking?.status === 'Booked'
        "
      />
      <span>Tourist</span>
    </label>
    <label
      class="radio-card"
      [class.checked]="booking?.customerType === 'company'"
    >
      <input
        type="radio"
        name="customerType"
        value="company"
        [checked]="booking?.customerType === 'company'"
        [disabled]="
          booking?.status === 'Paid' ||
          booking?.status === 'Pending' ||
          booking?.status === 'Booked'
        "
      />
      <span>Company</span>
    </label>
  </div>

  <div class="field-grid two-col">
    <div class="field">
      <label *ngIf="booking?.customerType === 'tourist'"
        >3. Nama Penuh Pelancong/Tourist Full Name<span class="required"
          >*</span
        ></label
      >
      <label *ngIf="booking?.customerType === 'company'"
        >3. Nama Penuh Syarikat/Company Full Name<span class="required"
          >*</span
        ></label
      >
      <input type="text" [value]="booking?.fullName" readonly />
    </div>
    <div class="field">
      <label>4. No. Telefon/Telephone No.<span class="required">*</span></label>
      <input type="text" [value]="booking?.phone" readonly />
    </div>
  </div>

  <div class="field-grid two-col">
    <div class="field">
      <label>5. Emel/Email<span class="required">*</span></label>
      <input type="text" [value]="booking?.email" readonly />
    </div>
  </div>

  <div class="field-grid two-col">
    <div class="field">
      <label>6. Bilangan Orang/No. of Pax<span class="required">*</span></label>
      <input
        type="text"
        [value]="booking?.domesticPax || booking?.internationalPax"
        readonly
      />
    </div>
  </div>

  <div class="field-grid two-col">
    <div class="field">
      <label>7. Pakej/Package<span class="required">*</span></label>
      <input type="text" [value]="booking?.packageName" readonly />
    </div>
    <div class="field">
      <label>8. Harga/Price (RM)<span class="required">*</span></label>
      <input type="text" [value]="booking?.packagePrice" readonly />
    </div>
  </div>

  <div class="field-grid one-col">
    <div class="field">
      <label
        >9. Nama Pengandali/Operator Name<span class="required">*</span></label
      >
      <input type="text" [value]="booking?.operatorName" readonly />
    </div>
  </div>
</section>
