<section class="form-section">
  <h3>New Activity Booking</h3>

  <div class="field-grid two-col">
    <div class="field">
      <label>2. Tarikh/Date<span class="required">*</span></label>
      <input type="text" [value]="booking?.bookedDate" readonly />
    </div>
    <div class="field">
      <label>3. Masa/Time<span class="required">*</span></label>
      <input type="text" [value]="booking?.time" readonly />
    </div>
  </div>

  <div class="field-grid one-col">
    <div class="field">
      <label
        >4. Nama Penuh Pelancong/Tourist Full Name<span class="required"
          >*</span
        ></label
      >
      <input type="text" [value]="booking?.fullName" readonly />
    </div>
  </div>

  <div class="field-grid two-col">
    <div class="field">
      <label>5. No. Telefon/Telephone No.<span class="required">*</span></label>
      <input type="text" [value]="booking?.phone" readonly />
    </div>
    <div class="field">
      <label>6. Emel/Email<span class="required">*</span></label>
      <input type="text" [value]="booking?.email" readonly />
    </div>
  </div>

  <!-- Domestik/Antarabangsa -->
  <section class="form-section">
    <h2 class="form-input-label">
      7. Domestik/Antarabangsa<span class="required">*</span>
    </h2>
    <div class="radio-grid three-col">
      <label
        class="radio-card"
        [class.checked]="booking?.nationality === 'domestic'"
      >
        <input
          type="radio"
          name="nationality"
          value="domestic"
          [checked]="booking?.nationality === 'domestic'"
          [disabled]="
            booking?.status === 'Paid' ||
            booking?.status === 'Pending' ||
            booking?.status === 'Booked'
          "
        />
        <span>Domestik</span>
      </label>
      <label
        class="radio-card"
        [class.checked]="booking?.nationality === 'international'"
      >
        <input
          type="radio"
          name="nationality"
          value="international"
          [checked]="booking?.nationality === 'international'"
          [disabled]="
            booking?.status === 'Paid' ||
            booking?.status === 'Pending' ||
            booking?.status === 'Booked'
          "
        />
        <span>Antarabangsa</span>
      </label>
      <label
        class="radio-card"
        [class.checked]="booking?.nationality === 'both'"
      >
        <input
          type="radio"
          name="nationality"
          value="both"
          [checked]="booking?.nationality === 'both'"
          [disabled]="
            booking?.status === 'Paid' ||
            booking?.status === 'Pending' ||
            booking?.status === 'Booked'
          "
        />
        <span>Domestik/Antarabangsa</span>
      </label>
    </div>
  </section>

  <!-- Mixed Nationality (Both) Layout -->
  <ng-container
    *ngIf="booking?.nationality === 'both'; else singleNationalityLayout"
  >
    <div class="field-grid two-col">
      <div class="field">
        <label
          >8(a). Bilangan Orang/No. of Pax (Domestik)<span class="required"
            >*</span
          ></label
        >
        <input type="text" [value]="booking?.domesticPax" readonly />
      </div>
      <div class="field">
        <label
          >8(b). Bilangan Orang/No. of Pax (Antarabangsa)<span class="required"
            >*</span
          ></label
        >
        <input type="text" [value]="booking?.internationalPax" readonly />
      </div>
    </div>

    <div class="field-grid two-col">
      <div class="field">
        <label>9. Aktiviti/Activity<span class="required">*</span></label>
        <input type="text" [value]="booking?.activityName" readonly />
      </div>
      <div class="field">
        <label>10. Jumlah/Total (RM)<span class="required">*</span></label>
        <input type="text" [value]="booking?.totalAmount" readonly />
      </div>
    </div>

    <div class="field-grid one-col">
      <div class="field">
        <label
          >11. Nama Pengandali/Operator Name<span class="required"
            >*</span
          ></label
        >
        <input type="text" [value]="booking?.operatorName" readonly />
      </div>
    </div>
  </ng-container>

  <!-- Single Nationality Layout - Activity beside Pax -->
  <ng-template #singleNationalityLayout>
    <div class="field-grid two-col">
      <div class="field">
        <label
          >8. Bilangan Orang/No. of Pax<span class="required">*</span></label
        >
        <input
          type="text"
          [value]="booking?.domesticPax || booking?.internationalPax"
          readonly
        />
      </div>
      <div class="field">
        <label>9. Aktiviti/Activity<span class="required">*</span></label>
        <input type="text" [value]="booking?.activityName" readonly />
      </div>
    </div>

    <div class="field-grid two-col">
      <div class="field">
        <label>10. Jumlah/Total (RM)<span class="required">*</span></label>
        <input type="text" [value]="booking?.totalAmount" readonly />
      </div>
      <div class="field">
        <label
          >11. Nama Pengandali/Operator Name<span class="required"
            >*</span
          ></label
        >
        <input type="text" [value]="booking?.operatorName" readonly />
      </div>
    </div>
  </ng-template>
</section>
