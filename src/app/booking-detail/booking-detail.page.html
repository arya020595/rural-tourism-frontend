<app-side-nav
  [menuId]="'booking-detail-menu'"
  [contentId]="'booking-detail-main-content'"
  [user]="user"
  [menuItems]="menuItems"
  [showHeaderLogo]="true"
  [logoutLabel]="'Log Keluar/Log-Out'"
  (menuItemTap)="onMenuItemTap($event)"
  (logoutTap)="logOut()"
></app-side-nav>

<ion-header class="booking-header" style="height: 5vh; box-shadow: none">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button
        menu="booking-detail-menu"
        class="menu-toggle"
      ></ion-menu-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <app-notification-bell [panel]="notifPanel"></app-notification-bell>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<app-notification-panel #notifPanel></app-notification-panel>

<ion-content [fullscreen]="true" id="booking-detail-main-content">
  <div class="surface-card">
    <div class="booking-container">
      <button type="button" class="back-link" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Kembali</span>
      </button>

      <div class="logo-row">
        <app-header-logo></app-header-logo>
      </div>

      <div class="title-row">
        <h1>View Booking Details - {{ booking?.id }}</h1>
        <div class="title-actions">
          <div class="booking-status">
            <span class="status-label">Booking Status</span>
            <span
              class="status-pill"
              [ngClass]="{'paid': booking?.status === 'paid', 'pending': booking?.status === 'pending', 'cancelled': booking?.status === 'cancelled'}"
            >
              {{ booking?.status | titlecase }}
            </span>
          </div>
        </div>
      </div>

      <ng-container *ngIf="booking; else noBookingTemplate">
        <div
          class="booking-form view-mode"
          [ngClass]="{'disabled-section': true}"
        >
          <section class="form-section disabled-section">
            <div class="section-head-row">
              <h3>1. Select Type</h3>
              <button
                *ngIf="booking?.status !== 'cancelled' && booking?.status !== 'paid'"
                type="button"
                class="pdf-button"
                (click)="viewPaymentReceipt()"
                [disabled]="isGeneratingPdf || !booking.numericId || isOffline"
              >
                <ion-spinner
                  *ngIf="isGeneratingPdf"
                  name="crescent"
                  class="pdf-spinner"
                ></ion-spinner>
                <ion-icon name="document-text-outline"></ion-icon>
                <span>{{ isOffline ? 'PDF Unavailable Offline' : 'Resit Deposit/Deposit Receipt' }}</span>
              </button>
            </div>
            <div class="radio-grid three-col">
              <label
                class="radio-card"
                [class.checked]="bookingType === 'activity'"
              >
                <input
                  type="radio"
                  name="type"
                  value="Activity"
                  [checked]="bookingType === 'activity'"
                  disabled
                />
                <span>Activity</span>
              </label>
              <label
                class="radio-card"
                [class.checked]="bookingType === 'accommodation'"
              >
                <input
                  type="radio"
                  name="type"
                  value="Accommodation"
                  [checked]="bookingType === 'accommodation'"
                  disabled
                />
                <span>Accommodation</span>
              </label>
              <label
                class="radio-card"
                [class.checked]="bookingType === 'package'"
              >
                <input
                  type="radio"
                  name="type"
                  value="Package"
                  [checked]="bookingType === 'package'"
                  disabled
                />
                <span>Package</span>
              </label>
            </div>
          </section>

          <app-activity-booking-form
            *ngIf="bookingType === 'activity'"
            [booking]="booking"
            [mode]="bookingMode"
          ></app-activity-booking-form>

          <app-accommodation-booking-form
            *ngIf="bookingType === 'accommodation'"
            [booking]="booking"
            [mode]="bookingMode"
          ></app-accommodation-booking-form>

          <app-package-booking-form
            *ngIf="bookingType === 'package'"
            [booking]="booking"
            [mode]="bookingMode"
          ></app-package-booking-form>
        </div>

        <!-- Action Buttons - Outside form so they remain clickable -->
        <ng-container
          *ngIf="booking.status === 'paid'; else bookedButtonsTemplate"
        >
          <div class="action-row action-row-three">
            <button
              type="button"
              class="bottom-action recall"
              (click)="recallBooking()"
            >
              <ion-icon name="arrow-undo-outline"></ion-icon>
              <span>Panggil Semula/Recall Booking</span>
            </button>
            <button
              type="button"
              class="bottom-action submit"
              (click)="goToReceipt()"
            >
              <ion-icon name="receipt-outline"></ion-icon>
              <span>Resit Bayaran/Payment Receipt</span>
            </button>
            <button
              type="button"
              class="bottom-action download"
              (click)="downloadReceiptPdf()"
              [disabled]="isGeneratingPdf || !booking.numericId || isOffline"
            >
              <ion-spinner
                *ngIf="isGeneratingPdf"
                name="crescent"
                class="pdf-spinner"
              ></ion-spinner>
              <ion-icon *ngIf="!isGeneratingPdf" name="download-outline"></ion-icon>
              <span>{{ isOffline ? 'PDF Unavailable Offline' : 'Muat Turun PDF/Download PDF' }}</span>
            </button>
          </div>

        </ng-container>

        <ng-template #bookedButtonsTemplate>
          <div
            *ngIf="booking.status === 'pending'; else cancelledButtonsTemplate"
            class="action-row action-row-three"
          >
            <button
              type="button"
              class="bottom-action cancel"
              (click)="cancelBooking()"
            >
              <ion-icon name="close-circle-outline"></ion-icon>
              <span>Batal Tempahan/Cancel Booking</span>
            </button>
            <button
              type="button"
              class="bottom-action edit"
              (click)="editBooking()"
            >
              <ion-icon name="pencil-outline"></ion-icon>
              <span>Kemaskini Tempahan/Update Booking</span>
            </button>
            <button
              type="button"
              class="bottom-action submit"
              (click)="goToReceipt()"
            >
              <ion-icon name="receipt-outline"></ion-icon>
              <span>Resit Bayaran/Payment Receipt</span>
            </button>
          </div>

          <ng-template #cancelledButtonsTemplate>
            <div class="action-row">
              <p class="cancelled-message">This booking has been cancelled.</p>
            </div>
          </ng-template>
        </ng-template>
      </ng-container>

      <ng-template #noBookingTemplate>
        <div class="no-data-message">
          <p>No booking data available.</p>
          <button type="button" class="bottom-action submit" (click)="goBack()">
            <span>Kembali/Back to List</span>
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</ion-content>

<ion-footer *ngIf="isOffline">
  <ion-toolbar color="medium">
    <div style="display:flex; align-items:center; gap:8px; padding: 0 16px;">
      <ion-icon name="cloud-offline-outline"></ion-icon>
      <ion-label>You are offline. Showing last saved booking data.</ion-label>
    </div>
  </ion-toolbar>
</ion-footer>
