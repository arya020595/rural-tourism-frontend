<form
  class="booking-form"
  [class.view-mode]="isViewMode"
  autocomplete="off"
  autocapitalize="off"
  spellcheck="false"
  novalidate
  (ngSubmit)="submitForm()"
>
  <section class="form-section">
    <h3>{{ formTitle }}</h3>

    <div class="field-grid two-col">
      <div class="field">
        <label>{{ n(2) }}. Tarikh/Date<span class="required">*</span></label>
        <div class="input-with-icon">
          <input
            type="text"
            class="date-display"
            readonly
            placeholder="dd/mm/yyyy"
            [value]="displayDate(bookingDate)"
            name="activityBookingDateDisplay"
            (click)="openDateSheet()"
          />
          <ion-icon
            name="calendar-clear-outline"
            aria-hidden="true"
            (click)="openDateSheet()"
          ></ion-icon>
        </div>
      </div>

      <div class="field">
        <label>{{ n(3) }}. Masa/Time</label>
        <!-- App-drawn time picker instead of a native <input type="time">:
             Android's own clock dialog gets cut off on some tablets in
             landscape and can't be resized from CSS. -->
        <div class="input-with-icon">
          <input
            type="text"
            class="time-display"
            readonly
            placeholder="--:-- --"
            [value]="bookingTimeDisplay"
            name="activityBookingTimeDisplay"
            (click)="openTimePicker()"
          />
          <ion-icon
            name="time-outline"
            aria-hidden="true"
            (click)="openTimePicker()"
          ></ion-icon>
        </div>
      </div>
    </div>

    <app-booking-date-sheet
      title="Tarikh/Date"
      [isOpen]="isDateSheetOpen"
      [value]="bookingDate"
      (dateSelected)="onDateSelected($event)"
      (dismissed)="isDateSheetOpen = false"
    ></app-booking-date-sheet>

    <ion-modal
      [isOpen]="isTimePickerOpen"
      (didDismiss)="closeTimePicker()"
      cssClass="time-picker-modal"
    >
      <ng-template>
        <ion-content class="time-modal-content">
          <div class="time-modal-inner">
            <h3>Masa/Time</h3>
            <ion-datetime
              presentation="time"
              hourCycle="h12"
              [preferWheel]="true"
              [showDefaultButtons]="false"
              [value]="pendingTime"
              (ionChange)="onPendingTimeChange($event)"
            ></ion-datetime>
          </div>
        </ion-content>

        <!-- Pinned outside ion-content so the buttons are always visible. -->
        <ion-footer class="time-modal-footer">
          <div class="time-modal-actions">
            <button type="button" class="time-modal-btn cancel" (click)="closeTimePicker()">
              Cancel
            </button>
            <button type="button" class="time-modal-btn apply" (click)="applyTime()">
              Set
            </button>
          </div>
        </ion-footer>
      </ng-template>
    </ion-modal>

    <div class="field-grid one-col">
      <div class="field">
        <label
          >{{ n(4) }}. Nama Penuh Pelancong/Tourist Full Name<span class="required"
            >*</span
          ></label
        >
        <input
          type="text"
          [(ngModel)]="fullName"
          name="actF01"
          autocomplete="off"
          autocorrect="off"
          aria-autocomplete="none"
          placeholder="Sila masukkan nama penuh pelancong/Please enter tourist full name"
          [readonly]="isViewMode"
        />
      </div>
    </div>

    <div class="field-grid two-col">
      <div class="field">
        <label>{{ n(5) }}. No. Telefon/Telephone No.</label>
        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="15"
          [(ngModel)]="phone"
          name="actF02"
          autocomplete="off"
          autocorrect="off"
          aria-autocomplete="none"
          placeholder="Sila masukkan no. telefon/Please enter telephone no."
          [readonly]="isViewMode"
          (input)="onNumericInput('phone', $any($event.target).value)"
          (keydown)="onNumericKeydown($event)"
          (paste)="onNumericPaste('phone', $event)"
        />
      </div>

      <div class="field">
        <label>{{ n(6) }}. Emel/Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="actF03"
          autocomplete="off"
          autocorrect="off"
          aria-autocomplete="none"
          placeholder="Sila masukkan emel/Please enter email"
          [readonly]="isViewMode"
        />
        <span *ngIf="emailError" class="field-error">{{ emailError }}</span>
      </div>
    </div>

    <section class="form-section">
      <h2 class="form-input-label">
        {{ n(7) }}. Domestik/Antarabangsa<span class="required">*</span>
      </h2>
      <div class="radio-grid three-col">
        <label
          class="radio-card"
          [class.active]="selectedNationality === 'domestic'"
        >
          <input
            type="radio"
            name="activityNationality"
            value="domestic"
            [(ngModel)]="selectedNationality"
            [disabled]="isViewMode"
          />
          <span>Domestik</span>
        </label>
        <label
          class="radio-card"
          [class.active]="selectedNationality === 'international'"
        >
          <input
            type="radio"
            name="activityNationality"
            value="international"
            [(ngModel)]="selectedNationality"
            [disabled]="isViewMode"
          />
          <span>Antarabangsa</span>
        </label>
        <label
          class="radio-card"
          [class.active]="selectedNationality === 'both'"
        >
          <input
            type="radio"
            name="activityNationality"
            value="both"
            [(ngModel)]="selectedNationality"
            [disabled]="isViewMode"
          />
          <span>Domestik/Antarabangsa</span>
        </label>
      </div>
    </section>

    <ng-container *ngIf="isMixedNationality; else singleNationalityLayout">
      <div class="field-grid two-col">
        <div class="field">
          <label
            >{{ n(8) }}(a). Bilangan Orang/No. of Pax (Domestik)<span class="required"
              >*</span
            ></label
          >
          <input
            type="number"
            inputmode="numeric"
            pattern="\d*"
            min="0"
            step="1"
            [(ngModel)]="domesticPax"
            name="activityDomesticPax"
            placeholder="Sila masukkan bilangan orang/Please insert number of pax"
            [readonly]="isViewMode"
            (input)="onNumericInput('domesticPax', $any($event.target).value)"
          />
        </div>

        <div class="field">
          <label
            >{{ n(8) }}(b). Bilangan Orang/No. of Pax (Antarabangsa)<span
              class="required"
              >*</span
            ></label
          >
          <input
            type="number"
            inputmode="numeric"
            pattern="\d*"
            min="0"
            step="1"
            [(ngModel)]="internationalPax"
            name="activityInternationalPax"
            placeholder="Sila masukkan bilangan orang/Please insert number of pax"
            [readonly]="isViewMode"
            (input)="
              onNumericInput('internationalPax', $any($event.target).value)
            "
          />
        </div>
      </div>

      <div class="field-grid two-col">
        <div class="field">
          <label>{{ n(9) }}. Aktiviti/Activity<span class="required">*</span></label>
          <input
            *ngIf="isViewMode"
            type="text"
            class="field-input"
            [value]="activity"
            readonly
          />
          <ng-container *ngIf="!isViewMode">
            <select
              class="field-input native-select"
              [(ngModel)]="activity"
              name="activityNameMixed"
              (ngModelChange)="onActivityInput()"
            >
              <option value="" disabled hidden>Sila pilih aktiviti</option>
              <option *ngFor="let option of activityOptions" [value]="option">
                {{ option }}
              </option>
            </select>
            <div class="field-error" *ngIf="activitySelectionError">
              {{ activitySelectionError }}
            </div>
          </ng-container>
        </div>

        <div class="field">
          <label>{{ n(10) }}. Jumlah/Total (RM)<span class="required">*</span></label>
          <input
            type="text"
            inputmode="decimal"
            [(ngModel)]="total"
            name="activityTotalMixed"
            placeholder="Sila isi jumlah bayaran/Please insert total payment"
            [readonly]="isViewMode"
            (input)="onMoneyInput('total', $any($event.target).value)"
            (blur)="onMoneyBlur('total')"
            (keydown)="onMoneyKeydown($event)"
          />
        </div>

        <!-- When deposit is hidden, Operator sits beside Total. -->
        <div class="field" *ngIf="hideDeposit">
          <label>{{ n(12) }}. Nama Pengendali/Operator Name</label>
          <input
            type="text"
            [(ngModel)]="operatorName"
            name="activityOperatorMixed"
            placeholder="Sila isi nama pengendali/Enter operator name"
            [readonly]="isViewMode"
          />
        </div>
      </div>

      <!-- Deposit + Operator row (shown only when deposit is visible). -->
      <div class="field-grid two-col" *ngIf="!hideDeposit">
        <div class="field">
          <label>{{ n(11) }}. Deposit/Total Deposit (RM)</label>
          <input
            type="text"
            inputmode="decimal"
            [(ngModel)]="totalDeposit"
            name="activityDepositMixed"
            placeholder="Sila isi deposit/Please insert deposit"
            [readonly]="isViewMode"
            (input)="onMoneyInput('totalDeposit', $any($event.target).value)"
            (blur)="onMoneyBlur('totalDeposit')"
            (keydown)="onMoneyKeydown($event)"
          />
        </div>

        <div class="field">
          <label>{{ n(12) }}. Nama Pengendali/Operator Name</label>
          <input
            type="text"
            [(ngModel)]="operatorName"
            name="activityOperatorMixedAlt"
            placeholder="Sila isi nama pengendali/Enter operator name"
            [readonly]="isViewMode"
          />
        </div>
      </div>
    </ng-container>

    <ng-template #singleNationalityLayout>
      <div class="field-grid two-col">
        <div class="field">
          <label
            >{{ n(8) }}. Bilangan Orang/No. of Pax<span class="required">*</span></label
          >
          <input
            type="number"
            inputmode="numeric"
            pattern="\d*"
            min="0"
            step="1"
            [(ngModel)]="paxCount"
            name="activityPax"
            placeholder="Sila masukkan bilangan orang/Please insert number of pax"
            [readonly]="isViewMode"
            (input)="onNumericInput('paxCount', $any($event.target).value)"
          />
        </div>

        <div class="field">
          <label>{{ n(9) }}. Aktiviti/Activity<span class="required">*</span></label>
          <input
            *ngIf="isViewMode"
            type="text"
            class="field-input"
            [value]="activity"
            readonly
          />
          <ng-container *ngIf="!isViewMode">
            <select
              class="field-input native-select"
              [(ngModel)]="activity"
              name="activityNameSingle"
              (ngModelChange)="onActivityInput()"
            >
              <option value="" disabled hidden>Sila pilih aktiviti</option>
              <option *ngFor="let option of activityOptions" [value]="option">
                {{ option }}
              </option>
            </select>
            <div class="field-error" *ngIf="activitySelectionError">
              {{ activitySelectionError }}
            </div>
          </ng-container>
        </div>
      </div>

      <div class="field-grid two-col">
        <div class="field">
          <label>{{ n(10) }}. Jumlah/Total (RM)<span class="required">*</span></label>
          <input
            type="text"
            inputmode="decimal"
            [(ngModel)]="total"
            name="activityTotalSingle"
            placeholder="Sila isi jumlah bayaran/Please insert total payment"
            [readonly]="isViewMode"
            (input)="onMoneyInput('total', $any($event.target).value)"
            (blur)="onMoneyBlur('total')"
            (keydown)="onMoneyKeydown($event)"
          />
        </div>
        <div class="field" *ngIf="!hideDeposit">
          <label>{{ n(11) }}. Deposit/Total Deposit (RM)</label>
          <input
            type="text"
            inputmode="decimal"
            [(ngModel)]="totalDeposit"
            name="activityDepositSingle"
            placeholder="Sila isi deposit/Please insert deposit"
            [readonly]="isViewMode"
            (input)="onMoneyInput('totalDeposit', $any($event.target).value)"
            (blur)="onMoneyBlur('totalDeposit')"
            (keydown)="onMoneyKeydown($event)"
          />
        </div>

        <!-- When deposit is hidden, Operator sits beside Total. -->
        <div class="field" *ngIf="hideDeposit">
          <label>{{ n(12) }}. Nama Pengendali/Operator Name</label>
          <input
            type="text"
            [(ngModel)]="operatorName"
            name="activityOperatorSingle"
            placeholder="Sila isi nama pengendali/Enter operator name"
            [readonly]="isViewMode"
          />
        </div>
      </div>

      <!-- Operator row (shown only when deposit is visible). -->
      <div class="field-grid two-col" *ngIf="!hideDeposit">
        <div class="field">
          <label>{{ n(12) }}. Nama Pengendali/Operator Name</label>
          <input
            type="text"
            [(ngModel)]="operatorName"
            name="activityOperatorSingleAlt"
            placeholder="Sila isi nama pengendali/Enter operator name"
            [readonly]="isViewMode"
          />
        </div>

        <div class="field" aria-hidden="true"></div>
      </div>
    </ng-template>

    <div class="validation-error-box" *ngIf="validationErrors.length > 0">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <ul>
        <li *ngFor="let err of validationErrors">{{ err }}</li>
      </ul>
    </div>

    <div *ngIf="!isViewMode" class="action-row" [class.single-action]="hideCancel">
      <button *ngIf="!hideCancel" type="button" class="bottom-action cancel" (click)="onCancel()">
        <ion-icon name="close-circle-outline"></ion-icon>
        <span>{{ mode === 'edit' ? 'Batal Edit/Cancel Edit' : 'Batal Tempahan/Cancel Booking' }}</span>
      </button>

      <button type="submit" class="bottom-action submit">
        <ion-icon name="paper-plane-outline"></ion-icon>
        <span>{{ submitLabel }}</span>
      </button>
    </div>
  </section>
</form>
