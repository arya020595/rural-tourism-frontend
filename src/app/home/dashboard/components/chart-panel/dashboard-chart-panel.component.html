<div class="chart-panel">
  <apx-chart
    [series]="chartSeries"
    [chart]="chartConfig"
    [colors]="colors"
    [xaxis]="xaxis"
    [yaxis]="yaxis"
    [dataLabels]="dataLabels"
    [plotOptions]="plotOptions"
    [fill]="fill"
    [stroke]="stroke"
    [markers]="markers"
    [grid]="grid"
    [legend]="legend"
    [tooltip]="tooltip"
    [title]="titleConfig"
  ></apx-chart>
</div>
