<app-side-nav
  [menuId]="'home-menu'"
  [contentId]="'home-main-content'"
  [user]="user"
  [menuItems]="menuItems"
  [showHeaderLogo]="true"
  [logoutLabel]="'Log Keluar/Log-Out'"
  (menuItemTap)="onMenuItemTap($event)"
  (logoutTap)="logOut()"
></app-side-nav>

<ion-header style="height: 5vh; box-shadow: none">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="home-menu" style="color: white"></ion-menu-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <app-notification-bell [panel]="notifPanel"></app-notification-bell>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<app-notification-panel #notifPanel></app-notification-panel>

<ion-content [fullscreen]="true" id="home-main-content">
  <div class="dashboard-shell">
    <div class="dashboard-container">
      <div class="logo-row">
        <app-header-logo></app-header-logo>
      </div>

      <div class="title-row">
        <h1>My Dashboard/<em>Dashboard Anda</em></h1>
      </div>

      <div class="mode-row">
        <div class="mode-buttons">
          <button
            type="button"
            class="mode-btn"
            [class.active]="mode === 'today'"
            (click)="switchMode('today')"
          >
            Today
          </button>
          <button
            type="button"
            class="mode-btn"
            [class.active]="mode === 'trend'"
            (click)="switchMode('trend')"
          >
            Trend
          </button>
        </div>

        <div class="asof" *ngIf="mode === 'today'">As of: {{ todayAsOfText }}</div>
      </div>

      <section class="trend-filter" *ngIf="mode === 'trend'">
        <h3>Select Month -Year Range</h3>
        <div class="filter-controls">
          <label>
            <span>From</span>
            <button
              type="button"
              class="month-picker-trigger"
              (click)="openTrendPicker('from', $event)"
            >
              <strong>{{ trendFromLabel }}</strong>
              <ion-icon name="calendar-outline"></ion-icon>
            </button>
          </label>
          <label>
            <span>To</span>
            <button
              type="button"
              class="month-picker-trigger"
              (click)="openTrendPicker('to', $event)"
            >
              <strong>{{ trendToLabel }}</strong>
              <ion-icon name="calendar-outline"></ion-icon>
            </button>
          </label>
          <button type="button" class="filter-btn apply" (click)="applyTrendFilter()">
            Filter
          </button>
          <button type="button" class="filter-btn reset" (click)="resetTrendFilter()">
            Reset
          </button>
        </div>
      </section>

      <ion-popover
        cssClass="trend-month-popover"
        [isOpen]="trendPickerTarget !== null"
        [event]="trendPickerEvent"
        [showBackdrop]="true"
        (didDismiss)="closeTrendPicker()"
      >
        <ng-template>
          <ion-datetime
            class="trend-month-datetime"
            presentation="month-year"
            preferWheel="true"
            [showDefaultButtons]="true"
            doneText="Done"
            cancelText="Cancel"
            [min]="trendMinDate"
            [max]="trendMaxDate"
            [value]="getTrendPickerValue()"
            (ionCancel)="closeTrendPicker()"
            (ionChange)="onTrendMonthChange($event); closeTrendPicker()"
          ></ion-datetime>
        </ng-template>
      </ion-popover>

      <section class="summary-section">
        <app-dashboard-summary-cards [summary]="activeSummary"></app-dashboard-summary-cards>
      </section>

      <section class="charts-section">
        <div class="chart-grid">
          <app-dashboard-chart-panel
            [title]="'Total Revenue (RM)'"
            [type]="revenueChartType"
            [categories]="revenueCategories"
            [series]="revenueSeries"
          ></app-dashboard-chart-panel>

          <app-dashboard-chart-panel
            [title]="'Total No. of Reciepts'"
            [type]="receiptsChartType"
            [categories]="receiptsCategories"
            [series]="receiptsSeries"
          ></app-dashboard-chart-panel>

          <app-dashboard-chart-panel
            [title]="'Total No. of Tourists'"
            [type]="touristsChartType"
            [categories]="touristsCategories"
            [series]="touristsSeries"
          ></app-dashboard-chart-panel>
        </div>
      </section>

      <section class="receipt-list-section">
        <h2>Receipt List/<em>Senarai Resit</em></h2>
        <app-dashboard-receipt-list-table
          [receipts]="activeReceipts"
          [meta]="receiptMeta"
          (pageChange)="onReceiptPageChange($event)"
          (pageSizeChange)="onReceiptPageSizeChange($event)"
        ></app-dashboard-receipt-list-table>
      </section>
    </div>
  </div>
</ion-content>
