<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Action</th>
        <th>Booked Date</th>
        <th>Service Name</th>
        <th>Type</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let booking of bookings; trackBy: trackByIndex">
        <td>
          <div class="action-cell">
            <button type="button" class="icon-btn info" aria-label="View booking details">
              <ion-icon name="information-circle"></ion-icon>
            </button>
            <button type="button" class="icon-btn edit" aria-label="Edit booking">
              <ion-icon name="create"></ion-icon>
            </button>
            <button type="button" class="icon-btn delete" aria-label="Delete booking">
              <ion-icon name="trash"></ion-icon>
            </button>
          </div>
        </td>
        <td>{{ formatDate(booking.bookedDate) }}</td>
        <td class="service-name">{{ booking.serviceName }}</td>
        <td>{{ booking.type }}</td>
        <td>
          <span
            class="status-pill"
            [class.paid]="booking.status === 'Paid'"
            [class.pending]="booking.status !== 'Paid'"
          >
            {{ booking.status === 'Paid' ? 'Paid' : 'Booked' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="table-footer">
  <div class="entries-control">
    <span>Show</span>
    <select>
      <option selected>10</option>
    </select>
    <span>entries</span>
  </div>

  <div class="entries-summary">Showing 1 to 10 out of {{ bookings.length }} entries</div>

  <div class="pagination">
    <button type="button" class="page-btn">&laquo; Previous</button>
    <button type="button" class="page-btn active">1</button>
    <button type="button" class="page-btn">Next &raquo;</button>
  </div>
</div>
