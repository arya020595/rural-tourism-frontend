<app-side-nav
  [menuId]="'users-menu'"
  [contentId]="'users-main-content'"
  [user]="user"
  [menuItems]="menuItems"
  [showHeaderLogo]="true"
  [logoutLabel]="'Log Keluar/Log-Out'"
  (menuItemTap)="onMenuItemTap($event)"
  (logoutTap)="logOut()"
></app-side-nav>

<ion-header class="um-header" style="height: 5vh; box-shadow: none">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="users-menu" class="menu-toggle"></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <app-notification-bell [panel]="notifPanel"></app-notification-bell>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<app-notification-panel #notifPanel></app-notification-panel>

<ion-content [fullscreen]="true" id="users-main-content" class="um-content">
  <div class="surface-card">
    <div class="um-container">
      <!-- ── Shared header logo ───────────────────────────────────────────── -->
      <div class="logo-row">
        <app-header-logo></app-header-logo>
      </div>
    <!-- ── Page header row (title + Add button) ───────────────────────────── -->
    <div class="um-page-header">
      <div class="page-title-row">
        <h1>Pengurusan Pengguna/<br class="mobile-break"><em>User Management</em></h1>
      </div>
      <div class="um-page-header__actions">
        <button
          class="um-add-btn"
          (click)="openAddModal()"
          *hasPermission="'user:create'"
        >
          <ion-icon name="add-circle-outline"></ion-icon>
          Tambah/Add
        </button>
      </div>
    </div>

    <!-- ── Search bar ─────────────────────────────────────────────────────── -->
    <div class="um-search-row">
      <ion-searchbar
        class="um-searchbar"
        placeholder="Cari nama, username atau e-mel / Search name, username or email"
        (ionInput)="onSearch($event)"
        debounce="0"
      ></ion-searchbar>
    </div>

    <!-- ── Loading ────────────────────────────────────────────────────────── -->
    <div class="um-spinner" *ngIf="isLoading">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <!-- ── Table ──────────────────────────────────────────────────────────── -->
    <div class="um-table-wrap" *ngIf="!isLoading">
      <table class="um-table">
        <thead>
          <tr>
            <th class="col-actions"></th>
            <th class="col-id">User ID</th>
            <th class="col-name">Full Name</th>
            <th class="col-email">Email Address</th>
            <th class="col-date">Created At</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users">
            <!-- Action buttons -->
            <td class="col-actions">
              <div class="um-action-btns">
                <button
                  type="button"
                  class="um-btn um-btn--info"
                  title="Lihat / View"
                  aria-label="View user"
                  (click)="openViewModal(u)"
                >
                  <ion-icon name="information-circle"></ion-icon>
                </button>
                <button
                  type="button"
                  class="um-btn um-btn--edit"
                  title="Kemaskini / Edit"
                  aria-label="Edit user"
                  (click)="openEditModal(u)"
                  *hasPermission="'user:update'"
                >
                  <ion-icon name="create"></ion-icon>
                </button>
                <button
                  type="button"
                  class="um-btn um-btn--delete"
                  title="Padam / Delete"
                  aria-label="Delete user"
                  (click)="openDeleteModal(u)"
                  *hasPermission="'user:delete'"
                >
                  <ion-icon name="trash"></ion-icon>
                </button>
              </div>
            </td>
            <td class="col-id">{{ formatUserId(u.id) }}</td>
            <td class="col-name">{{ u.name }}</td>
            <td class="col-email">{{ u.email }}</td>
            <td class="col-date">{{ formatDate(u.created_at) }}</td>
          </tr>

          <!-- Empty state -->
          <tr *ngIf="users.length === 0">
            <td colspan="5" class="um-empty">
              <ion-icon name="people-outline"></ion-icon>
              <p>Tiada pengguna dijumpai / No users found.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- ── Footer: per-page + info + pagination ───────────────────────────── -->
    <div class="um-footer" *ngIf="!isLoading && meta.total > 0">
      <!-- Per-page selector -->
      <div class="um-per-page">
        <label>Show</label>
        <select
          [(ngModel)]="meta.per_page"
          (ngModelChange)="onPerPageChange($event)"
        >
          <option *ngFor="let opt of perPageOptions" [ngValue]="opt">
            {{ opt }}
          </option>
        </select>
        <label>entries</label>
      </div>

      <!-- Record count -->
      <p class="um-count">
        Showing {{ showingFrom }} to {{ showingTo }} out of {{ meta.total }}
        entries
      </p>

      <!-- Pagination -->
      <nav class="um-pagination" aria-label="Pagination">
        <button
          class="um-page-btn"
          [disabled]="!meta.has_prev"
          (click)="goToPage(meta.page - 1)"
        >
          &laquo; Previous
        </button>

        <ng-container *ngFor="let btn of pageButtons">
          <button
            *ngIf="btn !== '...'"
            class="um-page-btn"
            [class.active]="btn === meta.page"
            (click)="goToPage(+btn)"
          >
            {{ btn }}
          </button>
          <span *ngIf="btn === '...'" class="um-ellipsis">&hellip;</span>
        </ng-container>

        <button
          class="um-page-btn"
          [disabled]="!meta.has_next"
          (click)="goToPage(meta.page + 1)"
        >
          Next &raquo;
        </button>
      </nav>
    </div>
    </div>
  </div>
</ion-content>
