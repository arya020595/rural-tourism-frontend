<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear">
        <ion-icon name="close-outline" slot="icon-only" style="color: white"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="ufm-scroll-content">
  <form #formRef="ngForm" (ngSubmit)="submit(formRef)">

    <!-- Full Name -->
    <div class="ufm-field">
      <label class="ufm-label">
        Nama Penuh / <em>Full Name</em> <span class="ufm-required">*</span>
      </label>
      <input
        class="ufm-input"
        type="text"
        placeholder="Sila isi nama penuh / Enter full name"
        [(ngModel)]="form.name"
        name="name"
        required
        #nameInput="ngModel"
      />
      <p class="ufm-error" *ngIf="nameInput.invalid && nameInput.touched">
        Full name is required.
      </p>
    </div>

    <!-- Username -->
    <div class="ufm-field">
      <label class="ufm-label">
        Nama Pengguna / <em>Username</em> <span class="ufm-required">*</span>
      </label>
      <input
        class="ufm-input"
        type="text"
        placeholder="Sila isi nama pengguna / Enter username"
        [(ngModel)]="form.username"
        name="username"
        required
        #usernameInput="ngModel"
      />
      <p class="ufm-error" *ngIf="usernameInput.invalid && usernameInput.touched">
        Username is required.
      </p>
    </div>

    <!-- Email -->
    <div class="ufm-field">
      <label class="ufm-label">
        Alamat E-mel / <em>Email Address</em> <span class="ufm-required">*</span>
      </label>
      <input
        class="ufm-input"
        type="email"
        placeholder="Sila isi alamat e-mel / Enter email address"
        [(ngModel)]="form.email"
        name="email"
        required
        email
        #emailInput="ngModel"
      />
      <p class="ufm-error" *ngIf="emailInput.invalid && emailInput.touched">
        A valid email address is required.
      </p>
    </div>

    <!-- Role (superadmin create only) -->
    <div class="ufm-field" *ngIf="isSuperadmin && !isEditMode">
      <label class="ufm-label">
        Peranan / <em>Role</em> <span class="ufm-required">*</span>
      </label>
      <select
        class="ufm-input ufm-select"
        [(ngModel)]="form.role_id"
        name="role_id"
        required
        #roleInput="ngModel"
      >
        <option [ngValue]="null" disabled>Pilih peranan / Select role</option>
        <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.name }}</option>
      </select>
      <p class="ufm-error" *ngIf="roleInput.invalid && roleInput.touched">
        Role is required.
      </p>
    </div>

    <!-- Password -->
    <div class="ufm-field">
      <label class="ufm-label">
        Kata Laluan / <em>Password</em>
        <span class="ufm-required" *ngIf="!isEditMode">*</span>
        <span class="ufm-optional" *ngIf="isEditMode">
          (kosong = tidak berubah / leave blank to keep current)
        </span>
      </label>
      <div class="ufm-input-wrap">
        <input
          class="ufm-input ufm-input--password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Sila isi kata laluan / Enter password"
          [(ngModel)]="form.password"
          name="password"
          autocomplete="new-password"
          [required]="!isEditMode"
          minlength="6"
          #passwordInput="ngModel"
        />
        <button
          type="button"
          class="ufm-toggle-password"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Sembunyi kata laluan / Hide password' : 'Papar kata laluan / Show password'"
        >
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
      <p class="ufm-error" *ngIf="passwordInput.invalid && passwordInput.touched">
        Password must be at least 6 characters.
      </p>
    </div>

    <!-- Confirm Password -->
    <div class="ufm-field">
      <label class="ufm-label">
        Sahkan Kata Laluan / <em>Confirm Password</em>
        <span class="ufm-required" *ngIf="!isEditMode">*</span>
      </label>
      <div class="ufm-input-wrap">
        <input
          class="ufm-input ufm-input--password"
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Sila isi kata laluan untuk mengesahkan / Enter password again"
          [(ngModel)]="form.confirmed_password"
          name="confirmed_password"
          autocomplete="new-password"
          [required]="!isEditMode || !!form.password"
          #confirmInput="ngModel"
        />
        <button
          type="button"
          class="ufm-toggle-password"
          (click)="showConfirmPassword = !showConfirmPassword"
          [attr.aria-label]="showConfirmPassword ? 'Sembunyi kata laluan / Hide password' : 'Papar kata laluan / Show password'"
        >
          <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
      <p class="ufm-error" *ngIf="confirmInput.invalid && confirmInput.touched">
        Confirm password is required.
      </p>
    </div>

    <!-- API error -->
    <p class="ufm-api-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <!-- Actions -->
    <div class="ufm-actions">
      <ion-button fill="outline" color="medium" (click)="dismiss()" [disabled]="isSaving">
        Batal / Cancel
      </ion-button>
      <ion-button color="primary" type="submit" [disabled]="isSaving">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        {{ isSaving ? "Menyimpan..." : "Simpan / Save" }}
      </ion-button>
    </div>

  </form>
</div>
