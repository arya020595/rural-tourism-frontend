<form class="booking-form" novalidate (ngSubmit)="submitForm()">
  <section class="form-section">
    <h3>New Package Booking</h3>

    <div class="radio-grid two-col customer-type-grid">
      <label class="radio-card" [class.active]="customerType === 'tourist'">
        <input
          type="radio"
          name="packageCustomerType"
          value="tourist"
          [(ngModel)]="customerType"
        />
        <span>Pelancong</span>
      </label>
      <label class="radio-card" [class.active]="customerType === 'company'">
        <input
          type="radio"
          name="packageCustomerType"
          value="company"
          [(ngModel)]="customerType"
        />
        <span>Syarikat</span>
      </label>
    </div>

    <div class="field-grid one-col">
      <div class="field">
        <label *ngIf="customerType === 'tourist'"
          >3. Nama Penuh Pelancong/Tourist Full Name</label
        >
        <label *ngIf="customerType === 'company'"
          >3. Nama Penuh Syarikat/Company Full Name</label
        >
        <input
          type="text"
          [(ngModel)]="fullName"
          name="packageFullName"
          [placeholder]="
            customerType === 'tourist'
              ? 'Sila masukkan nama penuh pelancong/Please enter tourist full name'
              : 'Sila masukkan nama penuh syarikat/Please enter company full name'
          "
        />
      </div>
    </div>

    <div class="field-grid two-col">
      <div class="field">
        <label>4. No. Telefon/Telephone No.</label>
        <input
          type="text"
          [(ngModel)]="phone"
          name="packagePhone"
          placeholder="Sila masukkan no. telefon/Please enter telephone no."
        />
      </div>

      <div class="field">
        <label>5. Emel/Email</label>
        <input
          type="text"
          [(ngModel)]="email"
          name="packageEmail"
          placeholder="Sila masukkan emel/Please enter email"
        />
      </div>
    </div>

    <section class="form-section">
      <h2 class="form-input-label">
        6. Domestik/Antarabangsa<span class="required">*</span>
      </h2>
      <div class="radio-grid three-col">
        <label
          class="radio-card"
          [class.active]="selectedNationality === 'domestic'"
        >
          <input
            type="radio"
            name="packageNationality"
            value="domestic"
            [(ngModel)]="selectedNationality"
          />
          <span>Domestik</span>
        </label>
        <label
          class="radio-card"
          [class.active]="selectedNationality === 'international'"
        >
          <input
            type="radio"
            name="packageNationality"
            value="international"
            [(ngModel)]="selectedNationality"
          />
          <span>Antarabangsa</span>
        </label>
        <label
          class="radio-card"
          [class.active]="selectedNationality === 'both'"
        >
          <input
            type="radio"
            name="packageNationality"
            value="both"
            [(ngModel)]="selectedNationality"
          />
          <span>Domestik/Antarabangsa</span>
        </label>
      </div>
    </section>

    <ng-container *ngIf="isMixedNationality; else singleNationalityLayout">
      <div class="field-grid two-col">
        <div class="field">
          <label
            >7(a). Bilangan Orang/No. of Pax (Domestik)<span class="required"
              >*</span
            ></label
          >
          <input
            type="text"
            [(ngModel)]="domesticPax"
            name="packageDomesticPax"
            placeholder="Sila masukkan bilangan orang/Please insert number of pax"
          />
        </div>

        <div class="field">
          <label
            >7(b). Bilangan Orang/No. of Pax (Antarabangsa)<span
              class="required"
              >*</span
            ></label
          >
          <input
            type="text"
            [(ngModel)]="internationalPax"
            name="packageInternationalPax"
            placeholder="Sila masukkan bilangan orang/Please insert number of pax"
          />
        </div>
      </div>

      <div class="field-grid two-col">
        <div class="field">
          <label>8. Tarikh/Date</label>
          <div class="input-with-icon">
            <input
              type="text"
              [(ngModel)]="bookingDate"
              name="packageDateMixed"
              placeholder="mm/dd/yy"
            />
            <ion-icon name="calendar-clear-outline"></ion-icon>
          </div>
        </div>

        <div class="field">
          <label>9. Pakej/Package<span class="required">*</span></label>
          <input
            type="text"
            [(ngModel)]="packageName"
            name="packageNameMixed"
            placeholder="Sila pilih syarikat berkaitan"
          />
        </div>
      </div>

      <div class="field-grid two-col">
        <div class="field">
          <label>10. Harga/Pricing (RM)</label>
          <input
            type="text"
            [(ngModel)]="packagePrice"
            name="packagePriceMixed"
            placeholder="RM"
          />
        </div>

        <div class="field">
          <label>11. Perkhidmatan Tambahan/Extra Service</label>
          <input
            type="text"
            [(ngModel)]="serviceName"
            name="packageServiceMixed"
            placeholder="Servis (cth: kayak)"
          />
        </div>
      </div>

      <div class="field-grid one-col">
        <div class="field half-width-field">
          <label>12. Nama Pengandali/Operator Name</label>
          <input
            type="text"
            [(ngModel)]="operatorName"
            name="packageOperatorMixed"
            placeholder="Sila isi nama pengandali/Enter operator name"
          />
        </div>
      </div>
    </ng-container>

    <ng-template #singleNationalityLayout>
      <div class="field-grid two-col">
        <div class="field">
          <label
            >7. Bilangan Orang/No. of Pax<span class="required">*</span></label
          >
          <input
            type="text"
            [(ngModel)]="paxCount"
            name="packagePax"
            placeholder="Sila masukkan bilangan orang/Please insert number of pax"
          />
        </div>

        <div class="field">
          <label>8. Tarikh/Date</label>
          <div class="input-with-icon">
            <input
              type="text"
              [(ngModel)]="bookingDate"
              name="packageDateSingle"
              placeholder="mm/dd/yy"
            />
            <ion-icon name="calendar-clear-outline"></ion-icon>
          </div>
        </div>
      </div>

      <div class="field-grid two-col">
        <div class="field">
          <label>9. Pakej/Package<span class="required">*</span></label>
          <input
            type="text"
            [(ngModel)]="packageName"
            name="packageNameSingle"
            placeholder="Sila pilih syarikat berkaitan"
          />
        </div>

        <div class="field">
          <label>10. Harga/Pricing (RM)</label>
          <input
            type="text"
            [(ngModel)]="packagePrice"
            name="packagePriceSingle"
            placeholder="RM"
          />
        </div>
      </div>

      <div class="field-grid two-col">
        <div class="field">
          <label>11. Perkhidmatan Tambahan/Extra Service</label>
          <input
            type="text"
            [(ngModel)]="serviceName"
            name="packageServiceSingle"
            placeholder="Servis (cth: kayak)"
          />
        </div>

        <div class="field half-width-field">
          <label>12. Nama Pengandali/Operator Name</label>
          <input
            type="text"
            [(ngModel)]="operatorName"
            name="packageOperatorSingle"
            placeholder="Sila isi nama pengandali/Enter operator name"
          />
        </div>
      </div>
    </ng-template>

    <div class="action-row">
      <button type="button" class="bottom-action cancel" (click)="onCancel()">
        <ion-icon name="close-circle-outline"></ion-icon>
        <span>Batal Tempahan/Cancel Booking</span>
      </button>

      <button type="submit" class="bottom-action submit">
        <ion-icon name="paper-plane-outline"></ion-icon>
        <span>Hantar Tempahan/Submit Booking</span>
      </button>
    </div>
  </section>
</form>
