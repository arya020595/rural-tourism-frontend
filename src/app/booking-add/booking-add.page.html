<app-side-nav
  [menuId]="'booking-add-menu'"
  [contentId]="'booking-add-main-content'"
  [user]="user"
  [menuItems]="menuItems"
  [showHeaderLogo]="true"
  [logoutLabel]="'Log Keluar/Log-Out'"
  (menuItemTap)="onMenuItemTap($event)"
  (logoutTap)="logOut()"
></app-side-nav>

<ion-header class="booking-header" style="height: 5vh; box-shadow: none">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="booking-add-menu" class="menu-toggle"></ion-menu-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button class="notification-button" aria-label="Notifications">
        <ion-icon class="notification-bell" slot="icon-only" name="notifications"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="booking-add-main-content">
  <div class="surface-card">
    <div class="booking-container">
      <button type="button" class="back-link" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Kembali</span>
      </button>

      <div class="logo-row">
        <app-header-logo></app-header-logo>
      </div>

      <div class="title-row">
        <h1>Enter Booking Details</h1>
      </div>

      <form class="booking-form" novalidate>
        <section class="form-section">
          <h2 class="form-input-label">1. Select Type</h2>
          <div class="radio-grid three-col">
            <label class="radio-card" [class.active]="selectedType === 'activity'">
              <input type="radio" name="bookingType" value="activity" [(ngModel)]="selectedType" />
              <span>Activity</span>
            </label>
            <label class="radio-card" [class.active]="selectedType === 'accommodation'">
              <input type="radio" name="bookingType" value="accommodation" [(ngModel)]="selectedType" />
              <span>Accommodation</span>
            </label>
            <label class="radio-card" [class.active]="selectedType === 'package'">
              <input type="radio" name="bookingType" value="package" [(ngModel)]="selectedType" />
              <span>Package</span>
            </label>
          </div>
        </section>

        <section class="form-section">
          <h3>New Activity Booking</h3>

          <div class="field-grid two-col">
            <div class="field">
              <label>2. Tarikh/Date<span class="required">*</span></label>
              <div class="input-with-icon">
                <input type="text" value="12/03/2026" />
                <ion-icon name="calendar-clear-outline"></ion-icon>
              </div>
            </div>

            <div class="field">
              <label>3. Masa/Time</label>
              <div class="input-with-icon">
                <input type="text" placeholder="Sila pilih masa aktiviti/Please choose the activity time" />
                <ion-icon name="time-outline"></ion-icon>
              </div>
            </div>
          </div>

          <div class="field-grid one-col">
            <div class="field">
              <label>4. Nama Penuh Pelancong/Tourist Full Name</label>
              <input type="text" placeholder="Sila masukkan nama penuh pelancong/Please enter tourist full name" />
            </div>
          </div>

          <div class="field-grid two-col">
            <div class="field">
              <label>5. No. Telefon/Telephone No.</label>
              <input type="text" placeholder="Sila masukkan no. telefon/Please enter telephone no." />
            </div>

            <div class="field">
              <label>6. Emel/Email</label>
              <input type="text" placeholder="Sila masukkan emel/Please enter email" />
            </div>
          </div>

          <section class="form-section">
            <h2 class="form-input-label">7. Domestik/Antarabangsa<span class="required">*</span></h2>
            <div class="radio-grid three-col">
              <label class="radio-card" [class.active]="selectedNationality === 'domestic'">
                <input type="radio" name="nationality" value="domestic" [(ngModel)]="selectedNationality" />
                <span>Domestik</span>
              </label>
              <label class="radio-card" [class.active]="selectedNationality === 'international'">
                <input type="radio" name="nationality" value="international" [(ngModel)]="selectedNationality" />
                <span>Antarabangsa</span>
              </label>
              <label class="radio-card" [class.active]="selectedNationality === 'both'">
                <input type="radio" name="nationality" value="both" [(ngModel)]="selectedNationality" />
                <span>Domestik/Antarabangsa</span>
              </label>
            </div>
          </section>

          <div class="field-grid two-col">
            <div class="field">
              <label>8. Bilangan Orang/No. of Pax<span class="required">*</span></label>
              <input type="text" placeholder="Sila masukkan bilangan orang/Please insert number of pax" />
            </div>

            <div class="field">
              <label>9. Aktiviti/Activity<span class="required">*</span></label>
              <input type="text" placeholder="Sila pilih aktiviti/Please choose an activity" />
            </div>
          </div>

          <div class="field-grid two-col">
            <div class="field">
              <label>10. Jumlah/Total (RM)<span class="required">*</span></label>
              <input type="text" placeholder="Sila isi jumlah bayaran/Please insert total payment" />
            </div>

            <div class="field">
              <label>11. Nama Pengandali/Operator Name</label>
              <input type="text" placeholder="Sila isi nama pengandali/Enter operator name" />
            </div>
          </div>

          <div class="action-row">
            <button type="button" class="bottom-action cancel">
              <ion-icon name="close-circle-outline"></ion-icon>
              <span>Batal Tempahan/Cancel Booking</span>
            </button>

            <button type="button" class="bottom-action submit">
              <ion-icon name="paper-plane-outline"></ion-icon>
              <span>Hantar Tempahan/Submit Booking</span>
            </button>
          </div>
        </section>
      </form>
    </div>
  </div>
</ion-content>
