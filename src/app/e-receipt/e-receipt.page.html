<!-- side menu -->
<app-side-nav
  [menuId]="'e-receipt-menu'"
  [contentId]="'e-receipt-main-content'"
  [user]="user"
  [menuItems]="menuItems"
  [showHeaderLogo]="true"
  [logoutLabel]="'Log Keluar/Log-Out'"
  (menuItemTap)="onMenuItemTap($event)"
  (logoutTap)="logOut()"
></app-side-nav>

<!-- main content -->
<ion-header class="e-receipt-header" style="height: 5vh; box-shadow: none">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="e-receipt-menu" class="menu-toggle"></ion-menu-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="goToNotifications()" class="notification-button">
        <ion-icon class="notification-bell" slot="icon-only" name="notifications"></ion-icon>
        <ion-badge *ngIf="unreadCount > 0" color="danger" class="notification-badge">
          {{ unreadCount }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="e-receipt-main-content">

  <ion-item color="medium" *ngIf="isOffline" lines="none">
    <ion-icon name="cloud-offline-outline" slot="start"></ion-icon>
    <ion-label>You are offline. Showing last synced bookings.</ion-label>
  </ion-item>

  <!-- ── DESKTOP view ── -->
  <div class="surface-card desktop-only">
    <div class="page-container">
      <div class="logo-row">
        <app-header-logo></app-header-logo>
      </div>

      <div class="title-row">
        <h1>E-Receipt</h1>
      </div>

      <div class="receipt-grid">
        <div class="receipt-tile" [routerLink]="['/e-receipt/add/activity']">
          <img [src]="activityBgSrc" class="tile-bg" alt="" />
          <div class="tile-label">
            <ion-card-title class="card-texts">Aktiviti<br />Tarikan</ion-card-title>
            <img [src]="treeIconSrc" class="tile-icon" />
          </div>
        </div>

        <div class="receipt-tile" [routerLink]="['/e-receipt/add/accommodation']">
          <img [src]="accomBgSrc" class="tile-bg" alt="" />
          <div class="tile-label">
            <ion-card-title class="card-texts">Tempat<br />Penginapan</ion-card-title>
            <img [src]="houseIconSrc" class="tile-icon" />
          </div>
        </div>

        <div class="receipt-tile" [routerLink]="['/e-receipt/add/package']">
          <img [src]="packageBgSrc" class="tile-bg" alt="" />
          <div class="tile-label">
            <ion-card-title class="card-texts">Pakej<br />Pelancongan</ion-card-title>
            <img [src]="packageIconSrc" class="tile-icon" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── MOBILE view (original design) ── -->
  <ion-card class="main-Container ion-no-margin mobile-only">
    <ion-card-content>
      <ion-col class="center">
        <app-header-logo></app-header-logo>
      </ion-col>
    </ion-card-content>

    <ion-card-content style="margin-top: 15%; padding-left: 0%; padding-right: 0%">
      <ion-card class="custom-card" [routerLink]="['/e-receipt/add/activity']">
        <img [src]="activityBgSrc" class="card-bg" alt="" />
        <ion-row class="cards">
          <div style="display: flex; flex-direction: row">
            <ion-card-title class="card-texts">Aktiviti<br />Tarikan</ion-card-title>
            <img [src]="treeIconSrc" class="tree" />
          </div>
        </ion-row>
      </ion-card>

      <ion-card class="custom-card2" style="margin-top: 5%" [routerLink]="['/e-receipt/add/accommodation']">
        <img [src]="accomBgSrc" class="card-bg" alt="" />
        <ion-row class="cards">
          <div style="display: flex; flex-direction: row">
            <ion-card-title class="card-texts">Tempat <br />Penginapan</ion-card-title>
            <img [src]="houseIconSrc" class="house" />
          </div>
        </ion-row>
      </ion-card>

      <ion-card class="custom-card3" style="margin-top: 5%" [routerLink]="['/e-receipt/add/package']">
        <img [src]="packageBgSrc" class="card-bg" alt="" />
        <ion-row class="cards">
          <div style="display: flex; flex-direction: row">
            <ion-card-title class="card-texts">Pakej <br />Pelancongan</ion-card-title>
            <img [src]="packageIconSrc" class="house" />
          </div>
        </ion-row>
      </ion-card>
    </ion-card-content>
  </ion-card>

</ion-content>
